name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    steps:
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists, skipping creation"
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "Calculator $GITHUB_REF_NAME" \
              --generate-notes
          fi

  linux:
    name: Linux (AppImage + tar.gz)
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Qt6
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev librsvg2-bin

      - name: Configure
        run: cmake -S . -B build-release -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF

      - name: Build
        run: cmake --build build-release -j 2

      - name: Build AppImage
        run: ./package/build-appimage.sh

      - name: Create tar.gz archive
        run: |
          mkdir -p dist
          DESTDIR="$(pwd)/dist-root" cmake --install build-release --prefix /usr
          tar -czf dist/Calculator-1.01-linux-x86_64.tar.gz -C dist-root usr

      - name: Upload to Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            package/Calculator-x86_64.AppImage \
            dist/Calculator-1.01-linux-x86_64.tar.gz \
            --clobber

  macos-arm64:
    name: macOS (arm64)
    needs: prepare
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Qt6
        run: |
          brew untap aws/tap 2>/dev/null || true
          brew install qt librsvg
          echo "$(brew --prefix qt)/bin" >> "$GITHUB_PATH"

      - name: Build DMG
        run: ./package/build-macos.sh "$PWD/build-macos" arm64

      - name: Create tar.gz archive
        run: |
          mkdir -p dist
          tar -czf dist/Calculator-1.01-macos-arm64.tar.gz -C build-macos Calculator.app

      - name: Upload to Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            package/Calculator-1.01-macos-arm64.dmg \
            dist/Calculator-1.01-macos-arm64.tar.gz \
            --clobber

  macos-x86_64:
    name: macOS (x86_64)
    needs: prepare
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v5

      - name: Install Qt6
        run: |
          brew untap aws/tap 2>/dev/null || true
          brew install qt librsvg
          echo "$(brew --prefix qt)/bin" >> "$GITHUB_PATH"

      - name: Build DMG
        run: ./package/build-macos.sh "$PWD/build-macos" x86_64

      - name: Create tar.gz archive
        run: |
          mkdir -p dist
          tar -czf dist/Calculator-1.01-macos-x86_64.tar.gz -C build-macos Calculator.app

      - name: Upload to Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            package/Calculator-1.01-macos-x86_64.dmg \
            dist/Calculator-1.01-macos-x86_64.tar.gz \
            --clobber

  windows:
    name: Windows (NSIS + MSI + zip)
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2.31.0
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-tools
            mingw-w64-ucrt-x86_64-librsvg
            mingw-w64-ucrt-x86_64-nsis

      - name: Configure
        shell: msys2 {0}
        run: cmake -S . -B build-release -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF

      - name: Build
        shell: msys2 {0}
        run: cmake --build build-release

      - name: Build NSIS installer
        shell: msys2 {0}
        run: makensis package/calculator.nsi

      - name: Stage MSI files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build-msi/staging
          Copy-Item build-release/Calculator.exe build-msi/staging/

      - name: Install WiX
        shell: pwsh
        run: |
          dotnet tool install --global wix
          echo "$env:USERPROFILE\.dotnet\tools" >> $env:GITHUB_PATH

      - name: Build MSI
        shell: msys2 {0}
        run: |
          export PATH="$(cygpath "$USERPROFILE/.dotnet/tools"):$PATH"
          pwsh -File package/build-msi.ps1 -SourceDir build-msi/staging -Output package/Calculator-1.01-win64.msi

      - name: Create zip archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Compress-Archive -Path build-msi/staging/* -DestinationPath dist/Calculator-1.01-win64.zip -Force

      - name: Upload to Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$env:GITHUB_REF_NAME" `
            package/Calculator-1.01-win64-installer.exe `
            package/Calculator-1.01-win64.msi `
            dist/Calculator-1.01-win64.zip `
            --clobber

  flatpak:
    name: Flatpak bundle
    needs: prepare
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.9
      options: --privileged
    steps:
      - uses: actions/checkout@v5

      - name: Build Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6.7
        with:
          manifest-path: io.github.primo.Calculator.yml
          build-bundle: true
          bundle: Calculator-1.01.flatpak
          artifact-name: Calculator-1.01.flatpak
          cache: true

  upload-flatpak:
    name: Upload Flatpak bundle
    needs: [prepare, flatpak]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: Calculator-1.01.flatpak
          path: dist

      - name: Upload to Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" dist/Calculator-1.01.flatpak --clobber
