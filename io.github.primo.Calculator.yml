id: io.github.primo.Calculator
runtime: org.kde.Platform
runtime-version: '6.9'
sdk: org.kde.Sdk
command: Calculator
rename-icon: calculator

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri

modules:
  - name: calculator
    buildsystem: cmake
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_TESTS=OFF
    sources:
      - type: dir
        path: .
    post-install:
      - install -Dm644 /app/share/applications/calculator.desktop /app/share/applications/io.github.primo.Calculator.desktop
      - install -Dm644 /app/share/icons/hicolor/256x256/apps/calculator.png /app/share/icons/hicolor/256x256/apps/io.github.primo.Calculator.png
      - install -Dm644 /app/share/icons/hicolor/scalable/apps/calculator.svg /app/share/icons/hicolor/scalable/apps/io.github.primo.Calculator.svg
      - desktop-file-edit --set-key=Icon --set-value=io.github.primo.Calculator /app/share/applications/io.github.primo.Calculator.desktop
